    private fun loadData() {

        fun lines(key: String): List<String> {
            return prefs
                .getString(key, "")
                .orEmpty()
                .split("\n")
                .filter { it.isNotBlank() }
        }

        lines("companies").forEach {
            companies.add(
                Company(decode(it))
            )
        }

        lines("jobs").forEach {

            val x = unpack(it)

            if (x.size >= 13) {
                jobs.add(
                    Job(
                        date = x[0],
                        company = x[1],
                        customer = x[2],
                        site = x[3],
                        kw = x[4].toDoubleOrNull() ?: 0.0,
                        payment = x[5].toDoubleOrNull() ?: 0.0,
                        expense = x[6].toDoubleOrNull() ?: 0.0,
                        salary = x[7].toDoubleOrNull() ?: 0.0,
                        type = x[8],
                        lat = x[9],
                        lon = x[10],
                        notes = x[11],
                        photoPath = x[12]
                    )
                )
            }
        }

        lines("customers").forEach {

            val x = unpack(it)

            if (x.size >= 10) {

                customers.add(
                    Customer(
                        name = x[0],
                        phone = x[1],
                        address = x[2],
                        company = x[3],
                        kw = x[4].toDoubleOrNull() ?: 0.0,
                        paid = x[5].toDoubleOrNull() ?: 0.0,
                        pending = x[6].toDoubleOrNull() ?: 0.0,
                        lat = x[7],
                        lon = x[8],
                        photoPath = x[9]
                    )
                )
            }
        }

        lines("workers").forEach {

            val x = unpack(it)

            if (x.size >= 4) {

                workers.add(
                    Worker(
                        name = x[0],
                        days = x[1].toIntOrNull() ?: 0,
                        salary = x[2].toDoubleOrNull() ?: 0.0,
                        advance = x[3].toDoubleOrNull() ?: 0.0
                    )
                )
            }
        }

        lines("stocks").forEach {

            val x = unpack(it)

            if (x.size >= 3) {

                stocks.add(
                    Stock(
                        name = x[0],
                        qty = x[1].toDoubleOrNull() ?: 0.0,
                        unit = x[2]
                    )
                )
            }
        }

        lines("reminders").forEach {

            val x = unpack(it)

            if (x.size >= 3) {

                reminders.add(
                    Reminder(
                        title = x[0],
                        date = x[1],
                        amount = x[2].toDoubleOrNull() ?: 0.0
                    )
                )
            }
        }

        lines("services").forEach {

            val x = unpack(it)

            if (x.size >= 3) {

                services.add(
                    Service(
                        customer = x[0],
                        date = x[1],
                        note = x[2]
                    )
                )
            }
        }

        if (companies.isEmpty()) {
            companies.add(Company("Company 1"))
            companies.add(Company("Company 2"))
        }
    }

