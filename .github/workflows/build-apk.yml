    private fun customersScreen() {

        setupScreen(
            "Customers",
            ::dashboard
        )

        actionButton(
            "＋ Add Customer"
        ) {
            addCustomerScreen()
        }

        if (customers.isEmpty()) {

            textView(
                "No customers added yet."
            )

            return
        }

        customers.asReversed()
            .take(100)
            .forEach { customer ->

                val view =
                    TextView(this)

                view.text =
                    "${customer.name}\n" +
                            "${customer.phone}\n" +
                            "${customer.address}\n" +
                            "${customer.kw} kW • " +
                            "Paid ${money(customer.paid)} • " +
                            "Pending ${money(customer.pending)}"

                view.textSize = 15f
                view.setTextColor(dark)
                view.setPadding(
                    16,
                    14,
                    16,
                    14
                )

                view.background =
                    roundedBackground(
                        Color.WHITE,
                        blue
                    )

                view.setOnClickListener {
                    customerDetailScreen(
                        customer
                    )
                }

                val params =
                    LinearLayout.LayoutParams(
                        -1,
                        105
                    )

                params.setMargins(
                    0,
                    5,
                    0,
                    5
                )

                content.addView(
                    view,
                    params
                )
            }
    }

