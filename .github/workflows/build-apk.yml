name: Build Edison Solar APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Edison Solar Project
        run: |
          set -e
          rm -rf project
          unzip -q EdisonSolar_V2_FINAL_NO_KOTLIN_ERROR.zip -d project
          echo "Project extracted"
          find project -maxdepth 3 -type f | head -50

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          set -e
          cd project/EdisonSolar_V2_FINAL_NO_KOTLIN_ERROR
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EdisonSolar-V2-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
