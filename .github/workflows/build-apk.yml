    private fun customersScreenFiltered(
        s: String
    ) {

        if (s.isBlank()) {

            customersScreen()

            return
        }

        setup(
            "Search Results",
            ::customersScreen
        )

        customers
            .filter {
                it.name.contains(s, true) ||
                it.phone.contains(s) ||
                it.address.contains(s, true)
            }
            .forEach {
                customerDetailCard(it)
            }
    }

