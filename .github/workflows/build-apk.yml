    private fun voicePayment(
        text: String
    ) {

        val name =
            extractName(text)

        val amount =
            numberAfter(
                text,
                listOf(
                    "payment",
                    "paid",
                    "collection",
                    "received",
                    "பணம்"
                )
            ) ?: firstNumber(text)
            ?: 0.0

        jobs.add(
            Job(
                date = today(),
                company = "Payment",
                customer = name,
                site = "",
                kw = 0.0,
                payment = amount,
                expense = 0.0,
                salary = 0.0,
                type = "Payment"
            )
        )

        val customer =
            customers.firstOrNull {
                it.name.equals(
                    name,
                    true
                )
            }

        if (customer != null) {

            customer.paid += amount

            customer.pending =
                (
                    customer.pending -
                            amount
                ).coerceAtLeast(0.0)
        }

        saveData()

        Toast.makeText(
            this,
            "✅ Payment Saved ${money(amount)}",
            Toast.LENGTH_LONG
        ).show()

        dashboard()
    }

