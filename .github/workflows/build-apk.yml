name: Build Edison Solar APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Check project
        shell: bash
        run: |
          echo "Checking Android project..."
          echo "Repository:"
          pwd
          echo "Files:"
          ls -la
          echo "App folder:"
          ls -la app

      - name: Build APK
        shell: bash
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Check APK
        shell: bash
        run: |
          echo "APK files:"
          find app/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Edison-Solar-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
