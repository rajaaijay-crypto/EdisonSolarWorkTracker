    private fun companiesScreen() {

        setup(
            "Companies",
            ::dashboard
        )

        companies.forEachIndexed { idx, c ->

            card(
                "Company ${idx + 1}",
                c.name
            )

            button(
                "Open Report: ${c.name}",
                false
            ) {
                companyReport(c.name)
            }
        }

        val e =
            edit(
                "Add company name"
            )

        button(
            "＋ Add Company"
        ) {

            if (e.text.isNotBlank()) {

                companies.add(
                    Company(
                        e.text.toString().trim()
                    )
                )

                save()

                companiesScreen()
            }
        }
    }

    private fun companyReport(
        name: String
    ) {

        setup(
            "Company Report",
            ::companiesScreen
        )

        val x =
            jobs.filter {
                it.company == name
            }

        card(
            "Installed kW",
