    private fun startVoice() {

        try {

            val intent =
                Intent(
                    RecognizerIntent.ACTION_RECOGNIZE_SPEECH
                )

            intent.putExtra(
                RecognizerIntent.EXTRA_LANGUAGE_MODEL,
                RecognizerIntent.LANGUAGE_MODEL_FREE_FORM
            )

            intent.putExtra(
                RecognizerIntent.EXTRA_LANGUAGE,
                voiceLanguage
            )

            intent.putExtra(
                RecognizerIntent.EXTRA_LANGUAGE_PREFERENCE,
                voiceLanguage
            )

            intent.putExtra(
                RecognizerIntent.EXTRA_MAX_RESULTS,
                5
            )

            intent.putExtra(
                RecognizerIntent.EXTRA_PROMPT,
                "Speak Edison Solar command"
            )

            startActivityForResult(
                intent,
                voiceRequestCode
            )

        } catch (exception: Exception) {

            Toast.makeText(
                this,
                "Voice recognition unavailable",
                Toast.LENGTH_LONG
            ).show()
        }
    }

    override fun onActivityResult(
        requestCode: Int,
        resultCode: Int,
        data: Intent?
    ) {

        super.onActivityResult(
            requestCode,
            resultCode,
            data
        )

        if (
            resultCode != RESULT_OK ||
            data == null
        ) {
            return
        }

        if (requestCode == 201) {

            val bitmap =
                data.extras
                    ?.get("data") as? Bitmap

            if (bitmap != null) {

                savePhoto(bitmap)

                Toast.makeText(
                    this,
                    "Photo Saved",
                    Toast.LENGTH_SHORT
                ).show()
            }

            return
        }

        val text =
            data.getStringArrayListExtra(
                RecognizerIntent.EXTRA_RESULTS
            )?.firstOrNull()
                .orEmpty()

        if (text.isBlank()) {
            return
        }

        when (requestCode) {

            501 -> {
                processVoiceInstallation(
                    text
                )
            }

            600 -> {
                processVoiceCommand(
                    text
                )
            }
        }
    }

    private fun normalize(
        value: String
    ): String {

        return value
            .lowercase(Locale.getDefault())
            .replace("₹", " rs ")
            .replace(",", " ")
            .replace("-", " ")
            .replace("/", " ")
            .replace(
                Regex("\\s+"),
                " "
            )
            .trim()
    }

    private fun firstNumber(
        text: String
    ): Double? {

        return Regex(
            "\\b\\d+(?:\\.\\d+)?\\b"
        )
            .find(
                normalize(text)
            )
            ?.value
            ?.toDoubleOrNull()
    }

    private fun numberAfter(
        text: String,
        keywords: List<String>
    ): Double? {

        val normalized =
            normalize(text)

        for (keyword in keywords) {

            val regex =
                Regex(
                    "${Regex.escape(keyword)}[^0-9]*(\\d+(?:\\.\\d+)?)",
                    RegexOption.IGNORE_CASE
                )

            val match =
                regex.find(normalized)

            if (match != null) {

                return match
                    .groupValues[1]
                    .toDoubleOrNull()
            }
        }

        return null
    }

    private fun phoneFromVoice(
        text: String
    ): String {

        val match =
            Regex(
                "(?:\\+91\\s*)?(\\d[\\s-]?){10}"
            ).find(text)

        val digits =
            match?.value
                ?.filter {
                    it.isDigit()
                }
                .orEmpty()

        return if (
            digits.length == 10
        ) {
            digits
        } else {
            ""
        }
    }

    private fun processVoiceCommand(
        text: String
    ) {

        val normalized =
            normalize(text)

        when {

            containsAny(
                normalized,
                "quotation",
                "quote",
                "கோட்டேஷன்"
            ) -> {
                voiceQuotation(text)
            }

            containsAny(
                normalized,
                "invoice",
                "bill",
                "இன்வாய்ஸ்",
                "பில்"
            ) -> {
                voiceInvoice(text)
            }

            containsAny(
                normalized,
                "payment",
                "paid",
                "collection",
                "received",
                "பணம்",
                "பேமெண்ட்"
            ) -> {
                voicePayment(text)
            }

            containsAny(
                normalized,
                "stock",
                "panel",
                "panels",
                "inventory",
                "ஸ்டாக்"
            ) -> {
                voiceStock(text)
            }

            containsAny(
                normalized,
                "worker",
                "staff",
                "employee",
                "வேலையாளர்"
            ) -> {
                voiceWorker(text)
            }

            containsAny(
                normalized,
                "reminder",
                "follow up",
                "followup",
                "நினைவூட்டல்"
            ) -> {
                voiceReminder(text)
            }

            containsAny(
                normalized,
                "service",
                "maintenance",
                "சர்வீஸ்"
            ) -> {
                voiceService(text)
            }

            containsAny(
                normalized,
                "customer",
                "client",
                "வாடிக்கையாளர்",
                "கஸ்டமர்"
            ) -> {
                voiceCustomer(text)
            }

            else -> {
                processVoiceInstallation(
                    text
                )
            }
        }
    }

    private fun containsAny(
        text: String,
        vararg words: String
    ): Boolean {

        return words.any {
            text.contains(
                it,
                ignoreCase = true
            )
        }
    }

    private fun extractName(
        text: String
    ): String {

        val words =
            text.split(
                Regex("\\s+")
            )

        val ignored =
            setOf(
                "customer",
                "client",
                "payment",
                "paid",
                "collection",
                "invoice",
                "bill",
                "quotation",
                "quote",
                "worker",
                "staff",
                "service",
                "reminder",
                "follow",
                "up",
                "stock",
                "panel",
                "panels",
                "site",
                "installation",
                "install",
                "salary",
                "expense",
                "advance",
                "kw"
            )

        val candidate =
            words.firstOrNull {
                it.isNotBlank() &&
                        it.lowercase(
                            Locale.getDefault()
                        ) !in ignored &&
                        !it.any {
                            char ->
                            char.isDigit()
                        }
            }

        return candidate ?: "Customer"
    }

    private fun processVoiceInstallation(
        text: String
    ) {

        val name =
            extractName(text)

        val kw =
            numberAfter(
                text,
                listOf(
                    "kw",
                    "kilowatt",
                    "கிலோவாட்"
                )
            ) ?: 0.0

        val payment =
            numberAfter(
                text,
                listOf(
                    "payment",
                    "paid",
                    "collection",
                    "received",
                    "பணம்"
                )
            ) ?: 0.0

        val expense =
            numberAfter(
                text,
                listOf(
                    "expense",
                    "செலவு"
                )
            ) ?: 0.0

        val salary =
            numberAfter(
                text,
                listOf(
                    "salary",
                    "labour",
                    "labor",
                    "சம்பளம்"
                )
            ) ?: 0.0

        jobs.add(
            Job(
                date = today(),
                company =
                    companies.firstOrNull()
                        ?.name
                        ?: "Company 1",
                customer = name,
                site = text,
                kw = kw,
                payment = payment,
                expense = expense,
                salary = salary,
                type = "Installation",
                lat = latitude,
                lon = longitude,
                notes = "Voice: $text"
            )
        )

        customers.add(
            Customer(
                name = name,
                phone = phoneFromVoice(text),
                address = text,
                company =
                    companies.firstOrNull()
                        ?.name
                        ?: "Company 1",
                kw = kw,
                paid = payment,
                pending = 0.0,
                lat = latitude,
                lon = longitude
            )
        )

        saveData()

        Toast.makeText(
            this,
            "✅ Voice Installation Saved",
            Toast.LENGTH_LONG
        ).show()

        dashboard()
    }

