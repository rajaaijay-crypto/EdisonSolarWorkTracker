    private fun reports() {

        setup(
            "Reports & Charts",
            ::dashboard
        )

        val m =
            jobs.filter {
                it.date.endsWith(month())
            }

        val profit =
            m.sumOf {
                it.payment -
                it.expense -
                it.salary
            }

        card(
            "Monthly Profit",
            money(profit),
            green
        )

        card(
            "Installed kW",
            String.format(
                Locale.getDefault(),
                "%.2f",
                m.sumOf { it.kw }
            )
        )

        card(
            "Collection",
            money(
                m.sumOf { it.payment }
            )
        )

        card(
            "Expenses",
            money(
                m.sumOf {
                    it.expense + it.salary
                }
            ),
            orange
        )

        val months =
            recentMonths()

        chart(
            "Monthly Collection",
            months,
            months.map { mm ->
                jobs.filter {
                    it.date.endsWith(mm)
                }.sumOf {
                    it.payment
                }
            },
            1,
            ""
        )

        chart(
            "Monthly Expenses",
            months,
            months.map { mm ->
                jobs.filter {
                    it.date.endsWith(mm)
                }.sumOf {
                    it.expense + it.salary
                }
            },
            1,
            ""
        )

        chart(
            "Monthly Profit",
            months,
            months.map { mm ->
                jobs.filter {
                    it.date.endsWith(mm)
                }.sumOf {
                    it.payment -
                    it.expense -
                    it.salary
                }
            },
            1,
            ""
        )

        val companyNames =
            companies.map {
                it.name
            }

        chart(
            "Company-wise Profit",
            companyNames,
            companyNames.map { co ->
                jobs.filter {
                    it.company == co
                }.sumOf {
                    it.payment -
                    it.expense -
                    it.salary
                }
            },
            0,
            ""
        )

        val kLabels =
            listOf(
                "1–2 kW",
                "3–5 kW",
                "6–10 kW",
                "10+ kW"
            )

        val kVals =
            listOf(
                jobs.count {
                    it.kw in 1.0..2.99
                }.toDouble(),

                jobs.count {
                    it.kw in 3.0..5.99
                }.toDouble(),

                jobs.count {
                    it.kw in 6.0..10.0
                }.toDouble(),

                jobs.count {
                    it.kw > 10.0
                }.toDouble()
            )

        chart(
            "System Size Distribution",
            kLabels,
            kVals,
            2
        )

        val paid =
            customers.count {
                it.pending <= 0.0
            }.toDouble()

        val pending =
            customers.count {
                it.pending > 0.0
            }.toDouble()

        chart(
            "Customer Payment Status",
            listOf(
                "Paid",
                "Pending"
            ),
            listOf(
                paid,
                pending
            ),
            2
        )

        tv(
            "Date-wise history",
            18f,
            true
        )

        m.groupBy {
            it.date
        }
            .toSortedMap()
            .entries
            .reversed()
            .forEach {

                val x = it.value

                tv(
                    "${it.key}: " +
                    String.format(
                        Locale.getDefault(),
                        "%.2f",
                        x.sumOf { j -> j.kw }
                    ) +
                    " kW • " +
                    "${money(x.sumOf { j -> j.payment })} collection • " +
                    "Profit ${money(x.sumOf { j -> j.payment - j.expense - j.salary })}"
                )
            }

        button(
            "📤 Export CSV"
        ) {
            exportCsv()
        }
    }

