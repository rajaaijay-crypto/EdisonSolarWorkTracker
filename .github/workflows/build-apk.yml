    private fun quoteScreen() {

        setup(
            "Quotation",
            ::billingMenu
        )

        val no =
            edit(
                "Quotation No",
                "QT-${
                    SimpleDateFormat(
                        "yyyyMMdd-HHmm",
                        Locale.getDefault()
                    ).format(Date())
                }"
            )

        val d =
            edit(
                "Date",
                now()
            )

        val c =
            edit("Customer")

        val phone =
            edit("Mobile")

        val size =
            edit("System Size kW")

        val panel =
            edit("Panel / Quantity")

        val inv =
            edit("Inverter")

        val structure =
            edit("Structure")

        val install =
            edit("Installation charges ₹")

        val cable =
            edit("Cable / Accessories ₹")

        val transport =
            edit("Transport ₹")

        val discount =
            edit("Discount ₹")

        val gst =
            edit(
                "GST %",
                "18"
            )

        button(
            "Generate PDF + Share"
        ) {

            val sub =
                (install.text.toString()
                    .toDoubleOrNull()
                    ?: 0.0) +
                (cable.text.toString()
                    .toDoubleOrNull()
                    ?: 0.0) +
                (transport.text.toString()
                    .toDoubleOrNull()
                    ?: 0.0)

            val total =
                (
                    sub -
                    (
                        discount.text.toString()
                            .toDoubleOrNull()
                            ?: 0.0
                    )
                ) *
                (
                    1 +
                    (
                        gst.text.toString()
                            .toDoubleOrNull()
                            ?: 0.0
                    ) / 100
                )

            sharePdf(
                "QUOTATION",
                listOf(
                    "No: ${no.text}",
                    "Date: ${d.text}",
                    "Customer: ${c.text}",
                    "Mobile: ${phone.text}",
                    "System: ${size.text} kW",
                    "Panel: ${panel.text}",
                    "Inverter: ${inv.text}",
                    "Structure: ${structure.text}",
                    "Installation: ${money(install.text.toString().toDoubleOrNull() ?: 0.0)}",
                    "Cable/Accessories: ${money(cable.text.toString().toDoubleOrNull() ?: 0.0)}",
                    "Transport: ${money(transport.text.toString().toDoubleOrNull() ?: 0.0)}",
                    "Discount: ${money(discount.text.toString().toDoubleOrNull() ?: 0.0)}",
                    "GST: ${gst.text}%",
                    "Grand Total: ${money(total)}",
                    "Terms: Quotation valid for 15 days."
                )
            )
        }
    }

