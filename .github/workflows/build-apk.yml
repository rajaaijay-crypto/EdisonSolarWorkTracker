<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>EDISON SOLAR Work App</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#eef8ff;
  color:#17324d;
}

header{
  background:linear-gradient(135deg,#0787e8,#0067c7);
  color:white;
  padding:18px 16px;
  border-radius:0 0 22px 22px;
}

.logo{
  font-size:23px;
  font-weight:800;
}

.sub{
  font-size:12px;
  margin-top:3px;
}

.container{
  padding:14px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.card{
  background:#fff;
  border-radius:16px;
  padding:16px;
  box-shadow:0 3px 12px #0001;
}

.tile{
  min-height:100px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  font-weight:700;
}

.icon{
  font-size:30px;
  margin-bottom:8px;
}

.blue{background:#e8f4ff}
.green{background:#e9fff4}
.orange{background:#fff4df}
.purple{background:#f2edff}

h2{
  font-size:19px;
  margin:6px 0 14px;
}

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 0;
  border-bottom:1px solid #eee;
}

button{
  border:0;
  border-radius:11px;
  padding:11px 14px;
  background:#0787e8;
  color:#fff;
  font-weight:700;
}

input,select,textarea{
  width:100%;
  padding:12px;
  border:1px solid #ccd8e2;
  border-radius:10px;
  margin:5px 0 10px;
  background:#fff;
}

label{
  font-size:12px;
  font-weight:700;
}

.back{
  background:#e8f4ff;
  color:#0067c7;
  margin-bottom:10px;
}

.nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#fff;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:space-around;
  padding:8px;
}

.nav button{
  background:none;
  color:#1672b9;
  padding:7px;
  font-size:11px;
}

.page{
  padding-bottom:70px;
}

.stat{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin:12px 0;
}

.stat .card{
  text-align:center;
  padding:12px;
}

.num{
  font-size:20px;
  font-weight:800;
}

.hide{
  display:none;
}

.ok{
  color:#07944b;
  font-weight:700;
}

.danger{
  color:#d33;
  font-weight:700;
}

.list{
  margin-top:10px;
}

.empty{
  color:#73808c;
  text-align:center;
  padding:20px;
}
</style>
</head>

<body>

<header>
  <div class="logo">☀ EDISON SOLAR</div>
  <div class="sub">
    Solar Work & Team Management • 6383287878
  </div>
</header>

<div class="container page">

<!-- DASHBOARD -->
<section id="home">

<div class="stat">

<div class="card">
<div class="num" id="sPresent">0</div>
Present
</div>

<div class="card">
<div class="num" id="sPay">₹0</div>
Today Payment
</div>

<div class="card">
<div class="num" id="sSites">0</div>
Sites
</div>

</div>

<div class="grid">

<div class="card tile blue"
onclick="show('attendance')">
<div class="icon">👷</div>
Attendance
</div>

<div class="card tile green"
onclick="show('payment')">
<div class="icon">₹</div>
Daily Payment
</div>

<div class="card tile orange"
onclick="show('site')">
<div class="icon">📍</div>
Site Work
</div>

<div class="card tile purple"
onclick="show('reports')">
<div class="icon">📊</div>
Reports
</div>

</div>

</section>


<!-- ATTENDANCE -->

<section id="attendance" class="hide">

<button class="back" onclick="show('home')">
← Dashboard
</button>

<h2>Attendance</h2>

<div class="card">

<label>Worker Name</label>

<input
id="aName"
placeholder="Worker name">

<label>Status</label>

<select id="aStatus">
<option>Present</option>
<option>Absent</option>
</select>

<button onclick="addAttendance()">
Save Attendance
</button>

</div>

<div id="aList" class="list"></div>

</section>


<!-- PAYMENT -->

<section id="payment" class="hide">

<button class="back" onclick="show('home')">
← Dashboard
</button>

<h2>Daily Payment</h2>

<div class="card">

<label>Worker Name</label>

<input
id="pName"
placeholder="Worker name">

<label>Amount (₹)</label>

<input
id="pAmount"
type="number"
placeholder="Amount">

<label>Payment Mode</label>

<select id="pMode">
<option>Cash</option>
<option>UPI</option>
<option>Bank</option>
</select>

<label>Remarks</label>

<input
id="pRemark"
placeholder="Site / work">

<button onclick="addPayment()">
Save Payment
</button>

</div>

<div id="pList" class="list"></div>

</section>


<!-- SITE WORK -->

<section id="site" class="hide">

<button class="back" onclick="show('home')">
← Dashboard
</button>

<h2>Site Work Details</h2>

<div class="card">

<label>Customer / Company</label>

<input
id="cName"
placeholder="Customer name">

<label>Site Location</label>

<input
id="cLoc"
placeholder="Area / location">

<label>Work Type</label>

<select id="cType">

<option>Installation</option>
<option>Service</option>
<option>Inspection</option>
<option>Maintenance</option>

</select>

<label>System Capacity (kW)</label>

<input
id="cKw"
type="number"
step="0.1"
placeholder="e.g. 3">

<label>Status</label>

<select id="cStatus">

<option>In Progress</option>
<option>Completed</option>
<option>Pending</option>

</select>

<label>Description</label>

<textarea
id="cDesc"
placeholder="Site work details">
</textarea>

<button onclick="addSite()">
Save Site Work
</button>

</div>

<div id="cList" class="list"></div>

</section>


<!-- REPORTS -->

<section id="reports" class="hide">

<button class="back" onclick="show('home')">
← Dashboard
</button>

<h2>Reports</h2>

<div class="stat">

<div class="card">
<div class="num" id="rWorkers">0</div>
Attendance Entries
</div>

<div class="card">
<div class="num" id="rPay">₹0</div>
Payments
</div>

<div class="card">
<div class="num" id="rKw">0</div>
kW
</div>

</div>

<div class="card">

<b>Today Summary</b>

<div
id="summary"
style="margin-top:10px">
</div>

</div>

</section>

</div>


<!-- BOTTOM NAVIGATION -->

<div class="nav">

<button onclick="show('home')">
⌂ Home
</button>

<button onclick="show('attendance')">
👷 Attendance
</button>

<button onclick="show('payment')">
₹ Payment
</button>

<button onclick="show('site')">
📍 Site
</button>

<button onclick="show('reports')">
▥ Reports
</button>

</div>


<script>

const K = {
  a:'es_a',
  p:'es_p',
  s:'es_s'
};

let A =
JSON.parse(
localStorage.getItem(K.a) || '[]'
);

let P =
JSON.parse(
localStorage.getItem(K.p) || '[]'
);

let S =
JSON.parse(
localStorage.getItem(K.s) || '[]'
);


function save(){

localStorage.setItem(
K.a,
JSON.stringify(A)
);

localStorage.setItem(
K.p,
JSON.stringify(P)
);

localStorage.setItem(
K.s,
JSON.stringify(S)
);

refresh();

}


function show(id){

document
.querySelectorAll('section')
.forEach(x =>
x.classList.add('hide')
);

document
.getElementById(id)
.classList.remove('hide');

refresh();

}


function addAttendance(){

let n =
aName.value.trim();

if(!n){

alert(
'Enter worker name'
);

return;

}

A.push({

n:n,

status:aStatus.value,

date:new Date()
.toLocaleDateString()

});

aName.value='';

save();

show('attendance');

}


function addPayment(){

let n =
pName.value.trim();

let amt =
Number(pAmount.value || 0);

if(!n || !amt){

alert(
'Enter worker and amount'
);

return;

}

P.push({

n:n,

amt:amt,

mode:pMode.value,

remark:pRemark.value,

date:new Date()
.toLocaleDateString()

});

pName.value='';

pAmount.value='';

pRemark.value='';

save();

show('payment');

}


function addSite(){

let n =
cName.value.trim();

if(!n){

alert(
'Enter customer/company'
);

return;

}

S.push({

n:n,

loc:cLoc.value,

type:cType.value,

kw:Number(cKw.value || 0),

status:cStatus.value,

desc:cDesc.value,

date:new Date()
.toLocaleDateString()

});

cName.value='';

cLoc.value='';

cKw.value='';

cDesc.value='';

save();

show('site');

}


function refresh(){

/* Dashboard */

sPresent.textContent =
A.filter(
x => x.status === 'Present'
).length;


sPay.textContent =
'₹' +
P.reduce(
(t,x) => t + x.amt,
0
).toLocaleString('en-IN');


sSites.textContent =
S.length;


/* Reports */

rWorkers.textContent =
A.length;


rPay.textContent =
'₹' +
P.reduce(
(t,x) => t + x.amt,
0
).toLocaleString('en-IN');


rKw.textContent =
S.reduce(
(t,x) => t + x.kw,
0
);


/* Attendance list */

aList.innerHTML =
A.length

?

A
.slice()
.reverse()
.map(x => `

<div class="card row">

<span>

<b>${x.n}</b>

<br>

<small>
${x.date}
</small>

</span>

<span class="${
x.status === 'Present'
? 'ok'
: 'danger'
}">

${x.status}

</span>

</div>

`)
.join('')

:

'<div class="empty">No attendance yet</div>';


/* Payment list */

pList.innerHTML =
P.length

?

P
.slice()
.reverse()
.map(x => `

<div class="card row">

<span>

<b>${x.n}</b>

<br>

<small>
${x.mode} •
${x.remark || ''}
</small>

</span>

<b>
₹${x.amt.toLocaleString('en-IN')}
</b>

</div>

`)
.join('')

:

'<div class="empty">No payments yet</div>';


/* Site list */

cList.innerHTML =
S.length

?

S
.slice()
.reverse()
.map(x => `

<div class="card">

<b>${x.n}</b>

<br>

${x.loc || '-'}
•
${x.type}
•
${x.kw} kW

<br>

<span>
${x.status}
</span>

<br>

<small>
${x.desc || ''}
</small>

</div>

`)
.join('')

:

'<div class="empty">No site work yet</div>';


/* Summary */

summary.innerHTML = `

Attendance:
${A.length}
entries

<br>

Payments:
₹${P.reduce(
(t,x)=>t+x.amt,
0
).toLocaleString('en-IN')}

<br>

Site Work:
${S.length}

<br>

Installed / tracked capacity:
${S.reduce(
(t,x)=>t+x.kw,
0
)}
kW

`;

}


/* Start app */

refresh();

</script>

</body>
</html>
