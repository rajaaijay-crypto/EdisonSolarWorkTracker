    private fun paymentScreen() {

        setupScreen(
            "Payment Collection",
            ::billingMenu
        )

        val customer =
            input("Customer")

        val amount =
            input("Payment ₹")

        val mode =
            input(
                "Payment Mode",
                "UPI"
            )

        val date =
            input(
                "Date",
                today()
            )

        actionButton(
            "💾 Save Payment"
        ) {

            val amountValue =
                amount.text.toString()
                    .toDoubleOrNull()
                    ?: 0.0

            jobs.add(
                Job(
                    date = date.text.toString(),
                    company = "Payment",
                    customer = customer.text.toString(),
                    site = "",
                    kw = 0.0,
                    payment = amountValue,
                    expense = 0.0,
                    salary = 0.0,
                    type = "Payment",
                    notes = "Mode: ${mode.text}"
                )
            )

            val found =
                customers.firstOrNull {
                    it.name.equals(
                        customer.text.toString(),
                        true
                    )
                }

            if (found != null) {

                found.paid +=
                    amountValue

                found.pending =
                    (
                        found.pending -
                                amountValue
                    ).coerceAtLeast(0.0)
            }

            saveData()

            Toast.makeText(
                this,
                "✅ Payment Saved",
                Toast.LENGTH_SHORT
            ).show()

            billingMenu()
        }
    }

    private fun reportsScreen() {

        setupScreen(
            "Reports & All Graphs",
            ::dashboard
        )

        val monthJobs =
            jobs.filter {
                it.date.endsWith(
                    currentMonth()
                )
            }

        val collection =
            monthJobs.sumOf {
                it.payment
            }

        val expenses =
            monthJobs.sumOf {
                it.expense + it.salary
            }

        val profit =
            collection - expenses

        card(
            "Monthly Collection",
            money(collection),
            blue
        )

        card(
            "Monthly Expenses",
            money(expenses),
            orange
        )

        card(
            "Monthly Profit",
            money(profit),
            green
        )

        card(
            "Monthly Installed",
            String.format(
                Locale.getDefault(),
                "%.2f kW",
                monthJobs.sumOf { it.kw }
            ),
            blue
        )

        val months =
            recentMonths()

        chart(
            "Monthly Collection",
            months,
            months.map { month ->
                jobs.filter {
                    it.date.endsWith(month)
                }.sumOf {
                    it.payment
                }
            },
            1
        )

        chart(
            "Monthly Expenses",
            months,
            months.map { month ->
                jobs.filter {
                    it.date.endsWith(month)
                }.sumOf {
                    it.expense + it.salary
                }
            },
            1
        )

        chart(
            "Monthly Profit",
            months,
            months.map { month ->
                jobs.filter {
                    it.date.endsWith(month)
                }.sumOf {
                    it.payment -
                            it.expense -
                            it.salary
                }
            },
            1
        )

        val companyLabels =
            companies.map {
                it.name
            }

        val companyValues =
            companies.map { company ->

                jobs.filter {
                    it.company == company.name
                }.sumOf {
                    it.payment -
                            it.expense -
                            it.salary
                }
            }

        if (companyLabels.isNotEmpty()) {

            chart(
                "Company-wise Profit",
                companyLabels,
                companyValues,
                0
            )
        }

        val oneToTwo =
            jobs.count {
                it.kw >= 1.0 &&
                        it.kw < 3.0
            }.toDouble()

        val threeToFive =
            jobs.count {
                it.kw >= 3.0 &&
                        it.kw < 6.0
            }.toDouble()

        val sixToTen =
            jobs.count {
                it.kw >= 6.0 &&
                        it.kw <= 10.0
            }.toDouble()

        val aboveTen =
            jobs.count {
                it.kw > 10.0
            }.toDouble()

        chart(
            "System Size Distribution",
            listOf(
                "1-2 kW",
                "3-5 kW",
                "6-10 kW",
                "10+ kW"
            ),
            listOf(
                oneToTwo,
                threeToFive,
                sixToTen,
                aboveTen
            ),
            2
        )

        val paidCustomers =
            customers.count {
                it.pending <= 0.0
            }.toDouble()

        val pendingCustomers =
            customers.count {
                it.pending > 0.0
            }.toDouble()

        chart(
            "Customer Payment Status",
            listOf(
                "Paid",
                "Pending"
            ),
            listOf(
                paidCustomers,
                pendingCustomers
            ),
            2
        )

        textView(
            "Date-wise History",
            18f,
            true
        )

        monthJobs
            .groupBy {
                it.date
            }
            .toSortedMap()
            .entries
            .reversed()
            .forEach { entry ->

                val list =
                    entry.value

                val kw =
                    list.sumOf {
                        it.kw
                    }

                val collectionValue =
                    list.sumOf {
                        it.payment
                    }

                val profitValue =
                    list.sumOf {
                        it.payment -
                                it.expense -
                                it.salary
                    }

                textView(
                    "${entry.key} • " +
                            "${
                                String.format(
                                    Locale.getDefault(),
                                    "%.2f",
                                    kw
                                )
                            } kW • " +
                            "${money(collectionValue)} • " +
                            "Profit ${money(profitValue)}"
                )
            }

        actionButton(
            "📤 Export Report CSV"
        ) {
            exportCsv()
        }
    }

