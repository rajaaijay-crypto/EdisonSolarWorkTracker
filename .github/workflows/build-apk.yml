name: Build Edison Solar APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          rm -rf project
          mkdir project
          unzip -o *.zip -d project

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Configure AndroidX and Java 17
        run: |
          echo "android.useAndroidX=true" > project/gradle.properties
          echo "android.enableJetifier=true" >> project/gradle.properties

          python3 - <<'PY'
          from pathlib import Path

          file = Path("project/app/build.gradle.kts")
          text = file.read_text()

          if "compileOptions {" not in text:
              text = text.replace(
                  "android {",
                  """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }"""
              )

          if "jvmToolchain(17)" not in text:
              text += """

          kotlin {
              jvmToolchain(17)
          }
          """

          file.write_text(text)
          PY

      - name: Build APK
        working-directory: ./project
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EdisonSolar-APK
          path: "project/app/build/outputs/apk/debug/*.apk"
