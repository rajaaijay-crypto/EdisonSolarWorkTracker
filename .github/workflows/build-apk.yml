name: Build Edison Solar APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "Current directory:"
          pwd

          echo "Project files:"
          ls -la

          echo "App folder:"
          ls -la app || true

          test -f settings.gradle.kts || test -f settings.gradle
          test -f build.gradle.kts || test -f build.gradle
          test -d app

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: |
          gradle assembleDebug --stacktrace

      - name: Find APK
        run: |
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EdisonSolar-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set +e
          gradle assembleDebug --stacktrace --console=plain 2>&1 | tee build.log
          RESULT=${PIPESTATUS[0]}

          echo ""
          echo "===================================="
          echo "KOTLIN COMPILER ERRORS"
          echo "===================================="

          grep -n -E "MainActivity.kt:|e: |error:" build.log || true

          echo "===================================="

          exit $RESULT

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EdisonSolar-Build-Log
          path: ${{ env.PROJECT_DIR }}/build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EdisonSolar-Professional-V2-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
