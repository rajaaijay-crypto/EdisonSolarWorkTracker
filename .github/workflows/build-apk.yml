name: Build Edison Solar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Extract Project
        run: |
          unzip -o EdisonSolarProfessionalV2_Voice_FIXED.zip -d extracted

      - name: Find Project
        run: |
          PROJECT_DIR=$(find extracted -name "settings.gradle.kts" -type f -print -quit | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set +e
          gradle assembleDebug --stacktrace --console=plain 2>&1 | tee build.log
          RESULT=${PIPESTATUS[0]}

          echo ""
          echo "===================================="
          echo "KOTLIN COMPILER ERRORS"
          echo "===================================="

          grep -n -E "MainActivity.kt:|e: |error:" build.log || true

          echo "===================================="

          exit $RESULT

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EdisonSolar-Build-Log
          path: ${{ env.PROJECT_DIR }}/build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EdisonSolar-Professional-V2-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
