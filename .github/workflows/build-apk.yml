    private fun editCustomer(
        c: Customer
    ) {

        setup(
            "Edit Customer",
            ::customersScreen
        )

        val n =
            edit(
                "Customer name",
                c.name
            )

        val p =
            edit(
                "Mobile",
                c.phone
            )

        val a =
            edit(
                "Address",
                c.address
            )

        val co =
            edit(
                "Company",
                c.company
            )

        val kw =
            edit(
                "kW",
                c.kw.toString()
            )

        val paid =
            edit(
                "Paid",
                c.paid.toString()
            )

        val pend =
            edit(
                "Pending",
                c.pending.toString()
            )

        button(
            "Update Customer"
        ) {

            c.name =
                n.text.toString()

            c.phone =
                p.text.toString()

            c.address =
                a.text.toString()

            c.company =
                co.text.toString()

            c.kw =
                kw.text.toString()
                    .toDoubleOrNull()
                    ?: c.kw

            c.paid =
                paid.text.toString()
                    .toDoubleOrNull()
                    ?: c.paid

            c.pending =
                pend.text.toString()
                    .toDoubleOrNull()
                    ?: c.pending

            save()

            customersScreen()
        }

        button(
            "🗑️ Delete Customer",
            false
        ) {

            customers.remove(c)

            save()

            customersScreen()
        }
    }

