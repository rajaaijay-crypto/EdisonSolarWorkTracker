    private fun now(): String =
        SimpleDateFormat(
            "dd/MM/yyyy",
            Locale.getDefault()
        ).format(Date())

    private fun month(): String =
        SimpleDateFormat(
            "MM/yyyy",
            Locale.getDefault()
        ).format(Date())

    private fun enc(s: String) =
        android.util.Base64.encodeToString(
            s.toByteArray(),
            android.util.Base64.NO_WRAP
        )

    private fun dec(s: String) =
        runCatching {
            String(
                android.util.Base64.decode(
                    s,
                    android.util.Base64.NO_WRAP
                )
            )
        }.getOrDefault("")

    private fun pack(parts: List<String>) =
        parts.joinToString("^") {
            enc(it)
        }

    private fun unpack(s: String) =
        s.split("^").map {
            dec(it)
        }

    private fun save() {

