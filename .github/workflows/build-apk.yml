    private fun quotationScreen() {

        setupScreen(
            "Quotation",
            ::billingMenu
        )

        val number =
            input(
                "Quotation No",
                "QT-" +
                        SimpleDateFormat(
                            "yyyyMMdd-HHmm",
                            Locale.getDefault()
                        ).format(Date())
            )

        val date =
            input(
                "Date",
                today()
            )

        val customer =
            input("Customer")

        val phone =
            input("Mobile")

        val size =
            input("System Size kW")

        val panel =
            input("Panel / Quantity")

        val inverter =
            input("Inverter")

        val structure =
            input("Structure")

        val installation =
            input("Installation ₹")

        val cable =
            input("Cable / Accessories ₹")

        val transport =
            input("Transport ₹")

        val discount =
            input("Discount ₹")

        val gst =
            input(
                "GST %",
                "18"
            )

        actionButton(
            "📄 Generate Quotation PDF"
        ) {

            val installationValue =
                installation.text.toString()
                    .toDoubleOrNull()
                    ?: 0.0

            val cableValue =
                cable.text.toString()
                    .toDoubleOrNull()
                    ?: 0.0

            val transportValue =
                transport.text.toString()
                    .toDoubleOrNull()
                    ?: 0.0

            val discountValue =
                discount.text.toString()
                    .toDoubleOrNull()
                    ?: 0.0

            val gstValue =
                gst.text.toString()
                    .toDoubleOrNull()
                    ?: 0.0

            val subtotal =
                installationValue +
                        cableValue +
                        transportValue -
                        discountValue

            val total =
                subtotal *
                        (1.0 + gstValue / 100.0)

            sharePdf(
                "QUOTATION",
                listOf(
                    "Quotation No: ${number.text}",
                    "Date: ${date.text}",
                    "Customer: ${customer.text}",
                    "Mobile: ${phone.text}",
                    "System: ${size.text} kW",
                    "Panel: ${panel.text}",
                    "Inverter: ${inverter.text}",
                    "Structure: ${structure.text}",
                    "Installation: ${money(installationValue)}",
                    "Cable: ${money(cableValue)}",
                    "Transport: ${money(transportValue)}",
                    "Discount: ${money(discountValue)}",
                    "GST: ${gstValue}%",
                    "Grand Total: ${money(total)}",
                    "Valid for 15 days",
                    "EDISON SOLAR - 6383287878"
                )
            )
        }
    }

    private fun invoiceScreen() {

        setupScreen(
            "Tax Invoice",
            ::billingMenu
        )

        val number =
            input(
                "Invoice No",
                "INV-" +
                        SimpleDateFormat(
                            "yyyyMMdd-HHmm",
                            Locale.getDefault()
                        ).format(Date())
            )

        val customer =
            input("Customer")

        val phone =
            input("Mobile")

        val description =
            input("Product / Service")

        val quantity =
            input(
                "Quantity",
                "1"
            )

        val rate =
            input("Rate ₹")

        val gst =
            input(
                "GST %",
                "18"
            )

        val paid =
            input("Paid ₹")

        actionButton(
            "📄 Generate Invoice PDF"
        ) {

            val qtyValue =
                quantity.text.toString()
                    .toDoubleOrNull()
                    ?: 1.0

            val rateValue =
                rate.text.toString()
                    .toDoubleOrNull()
                    ?: 0.0

            val gstValue =
                gst.text.toString()
                    .toDoubleOrNull()
                    ?: 0.0

            val paidValue =
                paid.text.toString()
                    .toDoubleOrNull()
                    ?: 0.0

            val base =
                qtyValue * rateValue

            val total =
                base *
                        (1.0 + gstValue / 100.0)

            val balance =
                total - paidValue

            sharePdf(
                "TAX INVOICE",
                listOf(
                    "Invoice No: ${number.text}",
                    "Customer: ${customer.text}",
                    "Mobile: ${phone.text}",
                    "Item: ${description.text}",
                    "Quantity: ${quantity.text}",
                    "Rate: ${money(rateValue)}",
                    "GST: ${gstValue}%",
                    "Grand Total: ${money(total)}",
                    "Paid: ${money(paidValue)}",
                    "Balance: ${money(balance)}",
                    "EDISON SOLAR - 6383287878"
                )
            )
        }
    }

    private fun paymentScreen() {

        setupScreen(
            "Payment Collection",
            ::billingMenu
        )

        val customer =
            input("Customer")

        val amount =
            input("Payment ₹")

        val mode =
            input(
                "Payment Mode",
                "UPI"
            )

        val date =
            input(
                "Date",
                today()
            )

        actionButton(
            "💾 Save Payment"
        ) {

            val amountValue =
                amount.text.toString()
                    .toDoubleOrNull()
                    ?: 0.0

            jobs.add(
                Job(
                    date = date.text.toString(),
                    company = "Payment",
                    customer = customer.text.toString(),
                    site = "",
                    kw = 0.0,
                    payment = amountValue,
                    expense = 0.0,
                    salary = 0.0,
                    type = "Payment",
                    notes = "Mode: ${mode.text}"
                )
            )

            val found =
                customers.firstOrNull {
                    it.name.equals(
                        customer.text.toString(),
                        true
                    )
                }

            if (found != null) {

                found.paid +=
                    amountValue

                found.pending =
                    (
                        found.pending -
                                amountValue
                    ).coerceAtLeast(0.0)
            }

            saveData()

            Toast.makeText(
                this,
                "✅ Payment Saved",
                Toast.LENGTH_SHORT
            ).show()

            billingMenu()
        }
    }

    private fun reportsScreen() {

        setupScreen(
            "Reports & All Graphs",
            ::dashboard
        )

        val monthJobs =
            jobs.filter {
                it.date.endsWith(
                    currentMonth()
                )
            }

        val collection =
            monthJobs.sumOf {
                it.payment
            }

        val expenses =
            monthJobs.sumOf {
                it.expense + it.salary
            }

        val profit =
            collection - expenses

        card(
            "Monthly Collection",
            money(collection),
            blue
        )

        card(
            "Monthly Expenses",
            money(expenses),
            orange
        )

        card(
            "Monthly Profit",
            money(profit),
            green
        )

        card(
            "Monthly Installed",
            String.format(
                Locale.getDefault(),
                "%.2f kW",
                monthJobs.sumOf { it.kw }
            ),
            blue
        )

        val months =
            recentMonths()

        chart(
            "Monthly Collection",
            months,
            months.map { month ->
                jobs.filter {
                    it.date.endsWith(month)
                }.sumOf {
                    it.payment
                }
            },
            1
        )

        chart(
            "Monthly Expenses",
            months,
            months.map { month ->
                jobs.filter {
                    it.date.endsWith(month)
                }.sumOf {
                    it.expense + it.salary
                }
            },
            1
        )

        chart(
            "Monthly Profit",
            months,
            months.map { month ->
                jobs.filter {
                    it.date.endsWith(month)
                }.sumOf {
                    it.payment -
                            it.expense -
                            it.salary
                }
            },
            1
        )

        val companyLabels =
            companies.map {
                it.name
            }

        val companyValues =
            companies.map { company ->

                jobs.filter {
                    it.company == company.name
                }.sumOf {
                    it.payment -
                            it.expense -
                            it.salary
                }
            }

        if (companyLabels.isNotEmpty()) {

            chart(
                "Company-wise Profit",
                companyLabels,
                companyValues,
                0
            )
        }

        val oneToTwo =
            jobs.count {
                it.kw >= 1.0 &&
                        it.kw < 3.0
            }.toDouble()

        val threeToFive =
            jobs.count {
                it.kw >= 3.0 &&
                        it.kw < 6.0
            }.toDouble()

        val sixToTen =
            jobs.count {
                it.kw >= 6.0 &&
                        it.kw <= 10.0
            }.toDouble()

        val aboveTen =
            jobs.count {
                it.kw > 10.0
            }.toDouble()

        chart(
            "System Size Distribution",
            listOf(
                "1-2 kW",
                "3-5 kW",
                "6-10 kW",
                "10+ kW"
            ),
            listOf(
                oneToTwo,
                threeToFive,
                sixToTen,
                aboveTen
            ),
            2
        )

        val paidCustomers =
            customers.count {
                it.pending <= 0.0
            }.toDouble()

        val pendingCustomers =
            customers.count {
                it.pending > 0.0
            }.toDouble()

       
