    private fun round(
        fill: Int,
        stroke: Int,
        w: Int,
        r: Int
    ) =
        android.graphics.drawable
            .GradientDrawable()
            .apply {

                setColor(fill)

                setStroke(
                    w,
                    stroke
                )

                cornerRadius =
                    r.toFloat()
            }

    private fun money(
        x: Double
    ) =
        "₹" +
        String.format(
            Locale.getDefault(),
            "%,.0f",
            x
        )

    private fun chart(
        title: String,
        labels: List<String>,
        values: List<Double>,
        type: Int = 0,
        suffix: String = ""
    ) {

        val v =
            SimpleChartView(this)

        v.title = title

        v.labels = labels

        v.values = values

        v.type = type

        v.suffix = suffix

        val height =
            when (type) {
                2 -> 330
                else -> 300
            }

        content.addView(
            v,
            LinearLayout.LayoutParams(
                -1,
                height
            ).apply {
                setMargins(
                    0,
                    8,
                    0,
                    12
                )
            }
        )
    }

    private fun recentMonths(
        n: Int = 6
    ): List<String> {

        val cal =
            Calendar.getInstance()

        val out =
            mutableListOf<String>()

        repeat(n) {

            out.add(
                String.format(
                    Locale.getDefault(),
                    "%02d/%04d",
                    cal.get(Calendar.MONTH) + 1,
                    cal.get(Calendar.YEAR)
                )
            )

            cal.add(
                Calendar.MONTH,
                -1
            )
        }

        return out.reversed()
    }

