    private fun exportCsv() {

        val file =
            File(
                filesDir,
                "edison_solar_report_" +
                        System.currentTimeMillis() +
                        ".csv"
            )

        val builder =
            StringBuilder()

        builder.append(
            "Date,Company,Customer,Site,kW,Payment,Expense,Salary,Net Profit\n"
        )

        jobs.forEach { job ->

            builder.append(
                "\"${job.date}\"," +
                        "\"${job.company}\"," +
                        "\"${job.customer}\"," +
                        "\"${job.site}\"," +
                        "\"${job.kw}\"," +
                        "\"${job.payment}\"," +
                        "\"${job.expense}\"," +
                        "\"${job.salary}\"," +
                        "\"${job.payment - job.expense - job.salary}\"\n"
            )
        }

        file.writeText(
            builder.toString()
        )

        val uri =
            FileProvider.getUriForFile(
                this,
                "$packageName.fileprovider",
                file
            )

        val shareIntent =
            Intent(
                Intent.ACTION_SEND
            )

        shareIntent.type =
            "text/csv"

        shareIntent.putExtra(
            Intent.EXTRA_STREAM,
            uri
        )

        shareIntent.addFlags(
            Intent.FLAG_GRANT_READ_URI_PERMISSION
        )

        startActivity(
            Intent.createChooser(
                shareIntent,
                "Export Edison Solar CSV"
            )
        )
    }

    private fun sharePdf(
        title: String,
        lines: List<String>
    ) {

        val document =
            PdfDocument()

        val page =
            document.startPage(
                PdfDocument.PageInfo
                    .Builder(
                        595,
                        842,
                        1
                    )
                    .create()
            )

        val canvas =
            page.canvas

        val paint =
            Paint(
                Paint.ANTI_ALIAS_FLAG
            )

        paint.color = dark
        paint.textSize = 22f
        paint.typeface =
            Typeface.DEFAULT_BOLD

        canvas.drawText(
            "EDISON SOLAR",
            40f,
            50f,
            paint
        )

        paint.textSize = 13f
        paint.typeface =
            Typeface.DEFAULT

        canvas.drawText(
            "6383287878",
            40f,
            75f,
            paint
        )

        paint.textSize = 18f
        paint.typeface =
            Typeface.DEFAULT_BOLD

        canvas.drawText(
            title,
            40f,
            110f,
            paint
        )

        paint.textSize = 12f
        paint.typeface =
            Typeface.DEFAULT

        var y = 140f

        lines.forEach { line ->

            if (y < 810f) {

                canvas.drawText(
                    line.take(90),
                    40f,
                    y,
                    paint
                )

                y += 22f
            }
        }

        document.finishPage(page)

        val file =
            File(
                filesDir,
                title.lowercase(
                    Locale.getDefault()
                ).replace(
                    " ",
                    "_"
                ) +
                        "_" +
                        System.currentTimeMillis() +
                        ".pdf"
            )

        FileOutputStream(file).use {
            document.writeTo(it)
        }

        document.close()

        val uri =
            FileProvider.getUriForFile(
                this,
                "$packageName.fileprovider",
                file
            )

        val shareIntent =
            Intent(
                Intent.ACTION_SEND
            )

        shareIntent.type =
            "application/pdf"

        shareIntent.putExtra(
            Intent.EXTRA_STREAM,
            uri
        )

        shareIntent.addFlags(
            Intent.FLAG_GRANT_READ_URI_PERMISSION
        )

        startActivity(
            Intent.createChooser(
                shareIntent,
                "Share $title"
            )
        )
    }

