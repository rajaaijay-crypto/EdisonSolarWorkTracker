            ::billingMenu
        )

        val number =
            input(
                "Quotation No",
                "QT-" +
                        SimpleDateFormat(
                            "yyyyMMdd-HHmm",
                            Locale.getDefault()
                        ).format(Date())
            )

        val date =
            input(
                "Date",
                today()
            )

        val customer =
            input("Customer")

        val phone =
            input("Mobile")

        val size =
            input("System Size kW")

        val panel =
            input("Panel / Quantity")

        val inverter =
            input("Inverter")

        val structure =
            input("Structure")

        val installation =
            input("Installation ₹")

        val cable =
            input("Cable / Accessories ₹")

        val transport =
            input("Transport ₹")

        val discount =
            input("Discount ₹")

        val gst =
            input(
                "GST %",
                "18"
            )

        actionButton(
            "📄 Generate Quotation PDF"
        ) {

            val installationValue =
                installation.text.toString()
                    .toDoubleOrNull()
                    ?: 0.0

            val cableValue =
                cable.text.toString()
                    .toDoubleOrNull()
                    ?: 0.0

            val transportValue =
                transport.text.toString()
                    .toDoubleOrNull()
                    ?: 0.0

            val discountValue =
                discount.text.toString()
                    .toDoubleOrNull()
                    ?: 0.0

            val gstValue =
                gst.text.toString()
                    .toDoubleOrNull()
                    ?: 0.0

            val subtotal =
                installationValue +
                        cableValue +
                        transportValue -
                        discountValue

            val total =
                subtotal *
                        (1.0 + gstValue / 100.0)

            sharePdf(
                "QUOTATION",
                listOf(
                    "Quotation No: ${number.text}",
                    "Date: ${date.text}",
                    "Customer: ${customer.text}",
                    "Mobile: ${phone.text}",
                    "System: ${size.text} kW",
                    "Panel: ${panel.text}",
                    "Inverter: ${inverter.text}",
                    "Structure: ${structure.text}",
                    "Installation: ${money(installationValue)}",
                    "Cable: ${money(cableValue)}",
                    "Transport: ${money(transportValue)}",
                    "Discount: ${money(discountValue)}",
                    "GST: ${gstValue}%",
                    "Grand Total: ${money(total)}",
                    "Valid for 15 days",
                    "EDISON SOLAR - 6383287878"
                )
            )
        }
    }

    private fun invoiceScreen() {

        setupScreen(
            "Tax Invoice",
            ::billingMenu
        )

        val number =
            input(
                "Invoice No",
                "INV-" +
                        SimpleDateFormat(
                            "yyyyMMdd-HHmm",
                            Locale.getDefault()
                        ).format(Date())
            )

        val customer =
            input("Customer")

        val phone =
            input("Mobile")

        val description =
            input("Product / Service")

        val quantity =
            input(
                "Quantity",
                "1"
            )

        val rate =
            input("Rate ₹")

        val gst =
            input(
                "GST %",
                "18"
            )

        val paid =
            input("Paid ₹")

        actionButton(
            "📄 Generate Invoice PDF"
        ) {

            val qtyValue =
                quantity.text.toString()
                    .toDoubleOrNull()
                    ?: 1.0

            val rateValue =
                rate.text.toString()
                    .toDoubleOrNull()
                    ?: 0.0

            val gstValue =
                gst.text.toString()
                    .toDoubleOrNull()
                    ?: 0.0

            val paidValue =
                paid.text.toString()
                    .toDoubleOrNull()
                    ?: 0.0

            val base =
                qtyValue * rateValue

            val total =
                base *
                        (1.0 + gstValue / 100.0)

            val balance =
                total - paidValue

            sharePdf(
                "TAX INVOICE",
                listOf(
                    "Invoice No: ${number.text}",
                    "Customer: ${customer.text}",
                    "Mobile: ${phone.text}",
                    "Item: ${description.text}",
                    "Quantity: ${quantity.text}",
                    "Rate: ${money(rateValue)}",
                    "GST: ${gstValue}%",
                    "Grand Total: ${money(total)}",
                    "Paid: ${money(paidValue)}",
                    "Balance: ${money(balance)}",
                    "EDISON SOLAR - 6383287878"
                )
            )
        }
