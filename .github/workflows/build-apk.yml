private class SimpleChartView(
    context: android.content.Context
) : View(context) {

    var title: String = ""
    var labels: List<String> = emptyList()
    var values: List<Double> = emptyList()
    var type: Int = 0
    var suffix: String = ""

    private val p = Paint(Paint.ANTI_ALIAS_FLAG)

    override fun onDraw(c: Canvas) {
        super.onDraw(c)

        c.drawColor(Color.WHITE)

        val w = width.toFloat()
        val h = height.toFloat()

        p.color = Color.rgb(25, 55, 85)
        p.textSize = 30f
        p.typeface = Typeface.DEFAULT_BOLD

        c.drawText(title, 24f, 38f, p)

        if (values.isEmpty()) {
            p.textSize = 18f
            p.typeface = Typeface.DEFAULT
            c.drawText("No data yet", 24f, 82f, p)
            return
        }

        val l = 58f
        val r = w - 24f
        val top = 62f
        val bot = h - 46f

        val maxV = max(1.0, values.maxOrNull() ?: 1.0)

        p.strokeWidth = 2f
        p.color = Color.LTGRAY

        c.drawLine(l, bot, r, bot, p)
        c.drawLine(l, top, l, bot, p)

        p.textSize = 18f
        p.typeface = Typeface.DEFAULT

        if (type == 2) {

            val cx = w / 2f
            val cy = (top + bot) / 2f
            val rad = minOf(w, h) * 0.28f

            val total = values.sum().coerceAtLeast(1.0)

            var start = -90f

            val colors = intArrayOf(
                Color.rgb(25, 118, 210),
                Color.rgb(34, 139, 84),
                Color.rgb(245, 143, 35),
                Color.rgb(156, 39, 176),
                Color.rgb(220, 70, 70),
                Color.rgb(0, 150, 136)
            )

            values.forEachIndexed { i, v ->

                p.color = colors[i % colors.size]

                val sweep = (v / total * 360).toFloat()

                c.drawArc(
                    cx - rad,
                    cy - rad,
                    cx + rad,
                    cy + rad,
                    start,
                    sweep,
                    true,
                    p
                )

                start += sweep
            }

            labels.forEachIndexed { i, lab ->

                p.color = colors[i % colors.size]

                c.drawRect(
                    24f,
                    bot + 8 + i * 22f,
                    40f,
                    bot + 24 + i * 22f,
                    p
                )

                p.color = Color.DKGRAY

                c.drawText(
                    "$lab (${String.format(Locale.getDefault(), "%.0f", values[i])})",
                    48f,
                    bot + 22 + i * 22f,
                    p
                )
            }

            return
        }

        val step =
            if (values.size == 1)
                r - l
            else
                (r - l) / (values.size - 1)

        if (type == 0) {

            val bw = ((r - l) / values.size) * .58f

            values.forEachIndexed { i, v ->

                val x =
                    l +
                    i * (r - l) / values.size +
                    (r - l) / values.size * .21f

                val y =
                    bot -
                    (v / maxV).toFloat() * (bot - top)

                p.color = Color.rgb(25, 118, 210)

                c.drawRect(
                    x,
                    y,
                    x + bw,
                    bot,
                    p
                )

                p.color = Color.DKGRAY

                c.drawText(
                    labels[i],
                    x,
                    bot + 25,
                    p
                )

                c.drawText(
                    String.format(
                        Locale.getDefault(),
                        "%.0f%s",
                        v,
                        suffix
                    ),
                    x,
                    y - 7,
                    p
                )
            }

        } else {

            p.color = Color.rgb(25, 118, 210)
            p.strokeWidth = 5f

            var lastX = l

            var lastY =
                bot -
                (values[0] / maxV).toFloat() *
                (bot - top)

            values.forEachIndexed { i, v ->

                val x = l + i * step

                val y =
                    bot -
                    (v / maxV).toFloat() *
                    (bot - top)

                if (i > 0) {
                    c.drawLine(
                        lastX,
                        lastY,
                        x,
                        y,
                        p
                    )
                }

                c.drawCircle(
                    x,
                    y,
                    7f,
                    p
                )

                p.color = Color.DKGRAY

                c.drawText(
                    labels[i],
                    x - 12,
                    bot + 25,
                    p
                )

                p.color = Color.rgb(25, 118, 210)

                lastX = x
                lastY = y
            }
        }
    }
}

