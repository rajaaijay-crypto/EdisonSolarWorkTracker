    }

    private fun recentMonths(): List<String> {

        val calendar =
            Calendar.getInstance()

        val result =
            mutableListOf<String>()

        repeat(6) {

            result.add(
                String.format(
                    Locale.getDefault(),
                    "%02d/%04d",
                    calendar.get(Calendar.MONTH) + 1,
                    calendar.get(Calendar.YEAR)
                )
            )

            calendar.add(
                Calendar.MONTH,
                -1
            )
        }

        return result.reversed()
    }

