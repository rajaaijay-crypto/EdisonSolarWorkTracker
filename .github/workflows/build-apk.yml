class SimpleChartView(context: android.content.Context) : View(context) {

    var title: String = ""
    var labels: List<String> = emptyList()
    var values: List<Double> = emptyList()
    var chartType: Int = 0
    var suffix: String = ""

    private val paint = Paint(Paint.ANTI_ALIAS_FLAG)

    override fun onDraw(canvas: Canvas) {
        super.onDraw(canvas)

        canvas.drawColor(Color.WHITE)

        val width = width.toFloat()
        val height = height.toFloat()

        paint.color = Color.rgb(25, 55, 85)
        paint.textSize = 25f
        paint.typeface = Typeface.DEFAULT_BOLD

        canvas.drawText(title, 20f, 35f, paint)

        if (values.isEmpty()) {
            paint.textSize = 17f
            paint.typeface = Typeface.DEFAULT
            canvas.drawText("No data yet", 20f, 75f, paint)
            return
        }

        val left = 55f
        val right = width - 20f
        val top = 60f
        val bottom = height - 50f

        val maxValue = max(1.0, values.maxOrNull() ?: 1.0)

        paint.color = Color.LTGRAY
        paint.strokeWidth = 2f

        canvas.drawLine(left, bottom, right, bottom, paint)
        canvas.drawLine(left, top, left, bottom, paint)

        if (chartType == 2) {
            drawPieChart(
                canvas,
                width,
                top,
                bottom
            )
            return
        }

        if (chartType == 0) {
            drawBarChart(
                canvas,
                left,
                right,
                top,
                bottom,
                maxValue
            )
        } else {
            drawLineChart(
                canvas,
                left,
                right,
                top,
                bottom,
                maxValue
            )
        }
    }

    private fun drawBarChart(
        canvas: Canvas,
        left: Float,
        right: Float,
        top: Float,
        bottom: Float,
        maxValue: Double
    ) {
        val count = values.size

        if (count == 0) return

        val slot = (right - left) / count
        val barWidth = slot * 0.55f

        values.forEachIndexed { index, value ->

            val x = left + index * slot + slot * 0.2f

            val barHeight =
                (value / maxValue).toFloat() * (bottom - top)

            val y = bottom - barHeight

            paint.color = Color.rgb(25, 118, 210)

            canvas.drawRect(
                x,
                y,
                x + barWidth,
                bottom,
                paint
            )

            paint.color = Color.DKGRAY
            paint.textSize = 13f
            paint.typeface = Typeface.DEFAULT

            val label =
                if (index < labels.size) labels[index] else ""

            canvas.drawText(
                label,
                x,
                bottom + 22f,
                paint
            )

            canvas.drawText(
                String.format(
                    Locale.getDefault(),
                    "%.0f%s",
                    value,
                    suffix
                ),
                x,
                y - 5f,
                paint
            )
        }
    }

    private fun drawLineChart(
        canvas: Canvas,
        left: Float,
        right: Float,
        top: Float,
        bottom: Float,
        maxValue: Double
    ) {
        if (values.isEmpty()) return

        val step =
            if (values.size == 1) {
                0f
            } else {
                (right - left) / (values.size - 1)
            }

        paint.color = Color.rgb(25, 118, 210)
        paint.strokeWidth = 5f

        var lastX = left
        var lastY =
            bottom -
                    (values[0] / maxValue).toFloat() *
                    (bottom - top)

        values.forEachIndexed { index, value ->

            val x = left + index * step

            val y =
                bottom -
                        (value / maxValue).toFloat() *
                        (bottom - top)

            if (index > 0) {
                canvas.drawLine(
                    lastX,
                    lastY,
                    x,
                    y,
                    paint
                )
            }

            canvas.drawCircle(
                x,
                y,
                6f,
                paint
            )

            paint.color = Color.DKGRAY
            paint.textSize = 13f

            val label =
                if (index < labels.size) labels[index] else ""

            canvas.drawText(
                label,
                x - 15f,
                bottom + 22f,
                paint
            )

            paint.color = Color.rgb(25, 118, 210)

            lastX = x
            lastY = y
        }
    }

    private fun drawPieChart(
        canvas: Canvas,
        width: Float,
        top: Float,
        bottom: Float
    ) {
        val total =
            values.sum().coerceAtLeast(1.0)

        val centerX = width / 2f
        val centerY = (top + bottom) / 2f

        val radius =
            minOf(width, bottom - top) * 0.28f

        val colors = intArrayOf(
            Color.rgb(25, 118, 210),
            Color.rgb(34, 139, 84),
            Color.rgb(245, 143, 35),
            Color.rgb(156, 39, 176),
            Color.rgb(220, 70, 70)
        )

        var startAngle = -90f

        values.forEachIndexed { index, value ->

            val sweep =
                (value / total * 360.0).toFloat()

            paint.color =
                colors[index % colors.size]

            canvas.drawArc(
                centerX - radius,
                centerY - radius,
                centerX + radius,
                centerY + radius,
                startAngle,
                sweep,
                true,
                paint
            )

            startAngle += sweep
        }

        values.forEachIndexed { index, value ->

            paint.color =
                colors[index % colors.size]

            val y =
                bottom + 10f + index * 24f

            canvas.drawRect(
                20f,
                y,
                38f,
                y + 18f,
                paint
            )

            paint.color = Color.DKGRAY
            paint.textSize = 14f

            val label =
                if (index < labels.size) labels[index]
                else ""

            canvas.drawText(
                "$label (${String.format(Locale.getDefault(), "%.0f", value)})",
                45f,
                y + 15f,
                paint
            )
        }
    }
}

