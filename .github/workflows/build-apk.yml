name: Build Edison Solar APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract Edison Solar project
        run: |
          set -e
          ZIP=$(find . -maxdepth 2 -type f -name 'EdisonSolar_V2_FINAL_NO_KOTLIN_ERROR.zip' -print -quit)
          if [ -z "$ZIP" ]; then
            echo "ERROR: EdisonSolar_V2_FINAL_NO_KOTLIN_ERROR.zip not found"
            find . -maxdepth 2 -type f -name '*.zip' -print
            exit 1
          fi
          rm -rf project
          unzip -q "$ZIP" -d project
          echo "Using: $ZIP"
          find project -maxdepth 4 -type f | head -80

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          set -e
          cd project/EdisonSolar_V2_FINAL_NO_KOTLIN_ERROR
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EdisonSolar-V2-APK-FINAL
          path: project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
