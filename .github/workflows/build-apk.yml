name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Edison Solar APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Extract Edison Solar Project
        shell: bash
        run: |
          set -e

          echo "Current directory:"
          pwd

          echo "Repository files:"
          ls -lah

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 3 -type f | head -100

          PROJECT_DIR=$(find extracted -type f \( \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
          \) -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Gradle project not found inside ZIP"
            exit 1
          fi

          echo "Gradle project found at:"
          echo "$PROJECT_DIR"

          cp -a "$PROJECT_DIR"/. .

          echo "Final project structure:"
          ls -lah

          echo "Checking app folder:"
          ls -lah app

          echo "Checking Gradle files:"
          ls -lah settings.gradle* build.gradle* gradle.properties

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          echo "Building APK..."

          gradle assembleDebug --stacktrace

      - name: Find APK
        shell: bash
        run: |
          echo "APK files:"
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EdisonSolar-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
